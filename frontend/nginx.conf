server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 12M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Laravel API - forwarded to the PHP-FPM container.
    location /api {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_pass app:9000;
    }

    # RSS feed and sitemap (Laravel web routes).
    location = /feed {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_pass app:9000;
    }

    location = /sitemap.xml {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_pass app:9000;
    }

    # Uploaded media shared with the backend container.
    location /storage/ {
        alias /var/www/backend/storage/app/public/;
        access_log off;
        expires 7d;
    }

    # Static assets with long cache.
    location /assets/ {
        access_log off;
        expires 30d;
    }

    # Vue SPA with history-mode fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
