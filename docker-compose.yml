name: newspulse

services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: newspulse-app
    restart: unless-stopped
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      APP_ENV: production
      APP_DEBUG: false
      APP_URL: http://localhost:8080
      FRONTEND_URL: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: newspulse
      DB_USERNAME: newspulse
      DB_PASSWORD: newspulse_secret
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      SESSION_DRIVER: database
      MAIL_MAILER: log
    volumes:
      - storage-data:/var/www/backend/storage
    depends_on:
      db:
        condition: service_healthy
    networks:
      - newspulse

  queue:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: newspulse-queue
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      APP_ENV: production
      APP_DEBUG: false
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: newspulse
      DB_USERNAME: newspulse
      DB_PASSWORD: newspulse_secret
      QUEUE_CONNECTION: database
      CACHE_STORE: database
    volumes:
      - storage-data:/var/www/backend/storage
    depends_on:
      app:
        condition: service_started
    networks:
      - newspulse

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: newspulse-scheduler
    restart: unless-stopped
    command: php artisan schedule:work
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      APP_ENV: production
      APP_DEBUG: false
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: newspulse
      DB_USERNAME: newspulse
      DB_PASSWORD: newspulse_secret
      QUEUE_CONNECTION: database
      CACHE_STORE: database
    volumes:
      - storage-data:/var/www/backend/storage
    depends_on:
      app:
        condition: service_started
    networks:
      - newspulse

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: newspulse-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - storage-data:/var/www/backend/storage:ro
    depends_on:
      app:
        condition: service_started
    networks:
      - newspulse

  db:
    image: mysql:8.4
    container_name: newspulse-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: newspulse
      MYSQL_USER: newspulse
      MYSQL_PASSWORD: newspulse_secret
      MYSQL_ROOT_PASSWORD: root_secret
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_secret"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - newspulse

volumes:
  mysql-data:
  storage-data:

networks:
  newspulse:
    driver: bridge
